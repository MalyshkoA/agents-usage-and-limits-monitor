<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090b" />
    <meta
      name="description"
      content="Browser simulator of the 960×240 Agents Usage &amp; Limits Monitor panel"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307090b'/%3E%3Crect x='10' y='25' width='44' height='14' rx='7' fill='%23d9ff3f'/%3E%3Ccircle cx='47' cy='32' r='4' fill='%2307090b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Limits Monitor Simulator</title>
  </head>
  <body>
    <main class="lab-shell">
      <header class="topbar">
        <div class="brand" aria-label="Limits Monitor simulator">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Limits Monitor</span>
          <span class="version">V0.1</span>
        </div>

        <div class="top-actions">
          <button class="quiet-button" id="toggleGrid" type="button" aria-pressed="false">
            <span class="grid-icon" aria-hidden="true"></span>
            Grid
          </button>
          <button class="quiet-button" id="toggleFullscreen" type="button">
            <span class="expand-icon" aria-hidden="true"></span>
            Full screen
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="Panel prototype">
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">ER-TFT3.71-1 · 960 × 240</p>
            <h1>A panel you read at a glance.</h1>
          </div>
          <div class="scenario-switcher" role="group" aria-label="Panel scene">
            <button class="scenario active" type="button" data-scene="limits">Limits</button>
            <button class="scenario" type="button" data-scene="focus">Focus</button>
            <button class="scenario" type="button" data-scene="call">Call</button>
            <button class="scenario" type="button" data-scene="build">Build</button>
          </div>
        </div>

        <div class="stage" id="stage">
          <div class="device-shadow" aria-hidden="true"></div>
          <section class="device" id="device" aria-label="Device screen">
            <div class="display" id="display">
              <canvas id="panelCanvas" width="960" height="240" tabindex="0" aria-label="Interactive 960 by 240 pixel panel framebuffer"></canvas>
            </div>
            <div class="hardware-control" aria-label="Physical mode encoder (concept)">
              <span class="hardware-label">MODE</span>
              <span class="encoder" aria-hidden="true"><i></i></span>
              <span class="hardware-hint">TURN · PUSH</span>
            </div>
          </section>
          <p class="scale-note">Physical screen · active area 91.4 × 22.9 mm · 4:1 aspect</p>
        </div>

        <aside class="inspector" aria-label="Prototype settings">
          <div class="inspector-copy">
            <span class="inspector-kicker">SELECTED</span>
            <strong id="selectedCell">Model limits</strong>
            <span id="selectedHint">Codex and Claude side by side; the layout fits up to four models.</span>
          </div>
          <div class="control-group">
            <label for="brightness">Brightness</label>
            <input id="brightness" type="range" min="35" max="100" value="86" />
            <output id="brightnessValue" for="brightness">86%</output>
          </div>
          <div class="legend" aria-label="Prototype status">
            <span><i class="legend-dot accent"></i>Framebuffer: 960 × 240</span>
            <span><i class="legend-dot muted"></i>Runtime: matches the board</span>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
